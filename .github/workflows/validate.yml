name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Script syntax
        run: for f in skills/*/scripts/*.mjs; do node --check "$f"; done
      - name: Manifests parse
        run: node -e "for (const f of ['.claude-plugin/marketplace.json','.claude-plugin/plugin.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            d=$(basename "$(dirname "$f")")
            grep -q "^name: $d$" "$f" || { echo "$f: name must equal folder ($d)"; exit 1; }
            grep -q "^description: " "$f" || { echo "$f: missing description"; exit 1; }
          done
